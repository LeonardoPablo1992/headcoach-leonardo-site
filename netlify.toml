[build]
  functions = "netlify/functions"
  publish = "."

# Copia alterna del portal de atletas en headcoachleonardopablo.com/atletas/ (para redes celulares
# que no cargan github.io): Netlify trae el portal desde GitHub Pages y lo sirve desde este dominio.
[[redirects]]
  from = "/atletas"
  to = "/atletas/"
  status = 301
  force = true

[[redirects]]
  from = "/atletas/*"
  to = "https://atletas.headcoachleonardopablo.com/:splat"
  status = 200
  force = true

# Respaldo de conexión del portal de atletas: si una red (por ejemplo datos móviles)
# no llega a supabase.co, el portal habla con el mismo servidor a través de este dominio.
[[redirects]]
  from = "/sb/*"
  to = "https://sdswyjkwupxwxgzjqpct.supabase.co/:splat"
  status = 200
  force = true
