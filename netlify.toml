[build]
  functions = "netlify/functions"
  publish = "."

# El portal de atletas (ProTrainerPlus) vive en /atletas/ de este sitio.
# atletas.headcoachleonardopablo.com solo redirige aquí.

# Respaldo de conexión del portal de atletas: si una red (por ejemplo datos móviles)
# no llega a supabase.co, el portal habla con el mismo servidor a través de este dominio.
[[redirects]]
  from = "/sb/*"
  to = "https://sdswyjkwupxwxgzjqpct.supabase.co/:splat"
  status = 200
  force = true

# El portal siempre debe cargar la última versión publicada (sin copia vieja en el navegador o celular)
[[headers]]
  for = "/atletas/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/atletas/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
